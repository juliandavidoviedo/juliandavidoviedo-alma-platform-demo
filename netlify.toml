[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify resolves "20" to the newest Node 20.x on the build image.
  # Vite 8 and oxlint require ^20.19.0 || >=22.12.0 — if a build ever fails on
  # the engine check, pin the full version here (e.g. "20.19.0") rather than
  # downgrading the toolchain.
  NODE_VERSION = "20"

# The demo is a single-page app: /admin, /reception, /student and /checkin are
# client-side routes with no file on disk. Without this fallback a page refresh
# or a shared deep link returns Netlify's 404 — a failure that never shows up in
# `vite dev`, only in production.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# It is a simulation with fictional data; keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
